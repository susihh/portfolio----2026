<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Susana</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0ff;
      --card-bg: #ffffff;
      --text: #2d2d2d;
      --subtext: #666;
      --accent: #a855f7;
      --accent2: #ec4899;
      --shadow: rgba(168,85,247,0.15);
    }
    body.dark {
      --bg: #0f0f1a;
      --card-bg: #1a1a2e;
      --text: #f0f0f0;
      --subtext: #aaa;
      --shadow: rgba(168,85,247,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s, color 0.4s;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      text-align: center;
      padding: 4rem 1rem 3rem;
      background: linear-gradient(135deg, #FF00E2 0%, #a855f7 45%, #6366f1 75%, #38bdf8 100%);
      overflow: hidden;
    }
    header h1 { font-size: 2.8rem; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    header p  { font-size: 1.1rem; color: rgba(255,255,255,0.85); margin-top: 0.4rem; font-weight: 300; }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin: 2rem 1rem 0;
      flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; max-width: 440px; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none; }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.8rem;
      border-radius: 50px;
      border: 2px solid transparent;
      background: var(--card-bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px var(--shadow);
      transition: border 0.3s;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .icon-btn {
      padding: 0.75rem 1.4rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .icon-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow); }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 1.8rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(168,85,247,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: transform 0.3s, box-shadow 0.3s;
      animation: pulse 2.5s infinite;
    }
    .fab:hover { transform: scale(1.15) rotate(90deg); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 2.2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.6rem;
    }
    .modal-header h3 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--subtext); }

    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      border: 2px solid rgba(168,85,247,0.2);
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      outline: none;
    }
    .emoji-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
    .emoji-opt {
      width: 40px; height: 40px; border-radius: 10px;
      border: 2px solid rgba(168,85,247,0.2); background: var(--bg);
      font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .emoji-opt.selected { border-color: var(--accent); background: rgba(168,85,247,0.1); }

    .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; }
    .btn-cancel {
      flex: 1; padding: 0.8rem; border-radius: 10px;
      border: 2px solid rgba(168,85,247,0.3); background: transparent;
      color: var(--text); font-weight: 600; cursor: pointer;
    }
    .btn-save {
      flex: 2; padding: 0.8rem; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 700; cursor: pointer;
    }

    /* ── GRID & CARDS ── */
    .section-title { text-align: center; margin: 2.5rem 0 0.5rem; font-size: 1.5rem; font-weight: 700; }
    .section-title span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .divider { display: block; width: 60px; height: 4px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin: 0.5rem auto 2rem; }
    .project-count { text-align: center; font-size: 0.85rem; color: var(--subtext); margin-top: -1.5rem; margin-bottom: 2rem; }

    main {
      max-width: 1080px; margin: 0 auto; padding: 0 1.2rem 6rem;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.6rem;
    }
    .card {
      background: var(--card-bg); border-radius: 18px; padding: 1.8rem;
      box-shadow: 0 6px 20px var(--shadow); position: relative; overflow: hidden;
      border: 1px solid rgba(168,85,247,0.1); transition: transform 0.3s, box-shadow 0.3s;
    }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 35px var(--shadow); }
    .card-icon {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 1rem;
    }
    .card h2 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
    .card p  { font-size: 0.9rem; color: var(--subtext); line-height: 1.6; margin-bottom: 1.2rem; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .card a {
      display: inline-flex; align-items: center; gap: 0.4rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      text-decoration: none; font-weight: 600; font-size: 0.82rem;
      padding: 0.48rem 1rem; border-radius: 50px; transition: opacity 0.2s;
    }
    .card a:hover { opacity: 0.85; }
    .card-tag {
      position: absolute; top: 1rem; right: 1rem; background: rgba(168,85,247,0.1);
      color: var(--accent); font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.7rem; border-radius: 50px;
    }
    .btn-delete { background: none; border: none; cursor: pointer; color: #f87171; font-size: 1.1rem; padding: 0.3rem 0.5rem; }

    #noResults { display: none; text-align: center; grid-column: 1 / -1; color: var(--subtext); padding: 3rem 0; }
    footer { text-align: center; padding: 2.5rem 1rem; background: var(--card-bg); font-size: 0.88rem; color: var(--subtext); }
    .toast {
      position: fixed; bottom: 6rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
      padding: 0.7rem 1.6rem; border-radius: 50px; font-weight: 600; font-size: 0.9rem;
      opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 2000; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <h1>Portfólio Susana</h1>
    <p>Meus Projetos e Códigos</p>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
      </svg>
      <input type="text" id="search" placeholder="Buscar projeto...">
    </div>
    <button class="icon-btn" id="toggleTheme">
      <span id="themeIcon">🌙</span> Tema
    </button>
  </div>

  <h2 class="section-title">Meus <span>Projetos</span></h2>
  <span class="divider"></span>
  <p class="project-count" id="projectCount"></p>

  <main id="projetos">
    <div id="noResults">🔍 Nenhum projeto encontrado.</div>
  </main>

  <button class="fab" id="fabBtn" title="Adicionar projeto">＋</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>✦ Novo Projeto</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>

      <div class="form-group">
        <label>📌 Título do Projeto</label>
        <input type="text" id="inputTitle" placeholder="Ex: Projeto 61 — Meu App">
      </div>

      <div class="form-group">
        <label>📝 Descrição</label>
        <textarea id="inputDesc" placeholder="Descreva brevemente o projeto..."></textarea>
      </div>

      <div class="form-group">
        <label>🔗 Link do Site / Repositório</label>
        <input type="text" id="inputLink" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>🎨 Ícone do card</label>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">Cancelar</button>
        <button class="btn-save" id="btnSave">💾 Salvar Projeto</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <p>© 2026 <strong>Susana</strong> · Feito com 💜 e muito código</p>
  </footer>

  <script>
    const DEFAULT_PROJECTS = [
      { id: 1, title: 'Projeto 1 — JavaScript', desc: 'Primeiros passos no back-end com JavaScript. Explorando lógica, funções e estruturas de dados.', link: 'https://github.com/susihh/inicio-backend', icon: '⚡', tag: 'Código' },
      { id: 2, title: 'Projeto 2 — Propriedade Intelectual', desc: 'Protegendo a inovação e a criatividade — uma análise sobre direitos autorais e patentes.', link: 'https://gamma.app/docs/Untitled-rqdm8o5hxt34jbd', icon: '🛡️', tag: 'Apresentação' },
      { id: 3, title: 'Projeto 3 — Agenda Escolar', desc: 'O papel essencial da agenda na organização do aluno — produtividade e planejamento escolar.', link: 'https://gamma.app/docs/O-Papel-Essencial-da-Agenda-na-Organizacao-do-Aluno-p4n5jm6sjg3y83y', icon: '📅', tag: 'Apresentação' },
      { id: 4, title: 'Projeto 4 — Ecossistema de Startups', desc: 'O cenário global de inovação — tendências, desafios e oportunidades para empreendedores.', link: 'https://gamma.app/docs/O-Ecossistema-de-Startups-em-2026-vfy98basn80knwh', icon: '🚀', tag: 'Apresentação' },
      { id: 5, title: 'Projeto 5 — Álbum da Copa do Mundo', desc: 'Figurinhas, coleções e nostalgia! Um álbum digital interativo da Copa do Mundo.', link: 'https://susihh.github.io/copa-do-mundo-/index..html.html', icon: '⚽', tag: 'Código' },
      { id: 6, title: 'Projeto 6 — Meu Primeiro App com Expo', desc: 'Aprendendo a Usar o Snack Expo - testando', link: 'https://github.com/susihh/text-app-', icon: '⚡', tag: 'Código' },
      { id: 7, title: 'Projeto 7 — APP de Troca de Imagens no Expo', desc: 'Projeto de aprendisado expo', link: 'https://github.com/susihh/snack.expo', icon: '💻', tag: 'Código' },
      { id: 33, title: 'Projeto 33 — Pesquisa', desc: 'melhores IA,s de 2026', link: 'https://notebooklm.google.com/notebook/1aeaca98-67e8-4603-968e-89d786132182/artifact/e0ffb7dc-1e06-4798-ac65-22d82a022705', icon: '📱', tag: 'Código' },
      { id: 35, title: 'Projeto 35 — Linkedin', desc: 'cadastro de currículo', link: 'https://www.linkedin.com/feed/', icon: '📄', tag: 'Link' },
      { id: 36, title: 'Projeto 36 — Pet Shop', desc: 'site de agendamento', link: 'https://tomato-paw-care-flow.base44.app', icon: '📅', tag: 'Código' },
      { id: 37, title: 'Projeto 37 — CodeDS', desc: 'site de aprendizado de DDS', link: 'https://dds-flow-master.base44.app', icon: '📊', tag: 'Link' },
      { id: 38, title: 'Projeto 38 — FinControl', desc: 'controle de finanças pessoais', link: 'https://spiritual-fin-flow-go.base44.app', icon: '📊', tag: 'Link' },
      { id: 39, title: 'Projeto 39 — Turma Gentil', desc: 'controle escolar', link: 'https://mimo-escola-fcil.base44.app', icon: '🌍', tag: 'Link' },
      { id: 40, title: 'Projeto 40 — Abastecer+', desc: 'Controle de Abastecimento ( veículos )', link: 'https://meu-tanque-flow.base44.app', icon: '⚡', tag: 'Link' },
      { id: 41, title: 'Projeto 41 — mymoney', desc: 'Controle de dinheiro', link: 'https://mymoney-copy-cd4a299d.base44.app', icon: '📊', tag: 'Link' },
      { id: 42, title: 'Projeto 42 — aumento salarial', desc: 'python', link: 'https://terra-trek-hub.base44.app/', icon: '💡', tag: 'Link' }
    ];

    const EMOJIS = ['⚡','🚀','🛡️','📅','⚽','🎮','💡','🎨','📱','🔥','🌐','📊','🤖','🎵','🛒','💻','📝','🔬','🌍','🏆'];
    let selectedEmoji = '💡';

    // Função que identifica automaticamente o texto do botão com base no URL
    function formatLinkLabel(url) {
      if (!url) return '🔗 Ver Link';
      if (url.includes('github.com')) return '🔗 Ver no GitHub';
      if (url.includes('gamma.app')) return '📊 Ver Apresentação';
      if (url.includes('linkedin.com')) return '📄 Ver no LinkedIn';
      if (url.includes('notebooklm.google.com')) return '📄 Ver no NotebookLM';
      return '🌐 Acessar Site';
    }

    function loadProjects() {
      const saved = localStorage.getItem('susana_projects');
      if (saved) return JSON.parse(saved);
      localStorage.setItem('susana_projects', JSON.stringify(DEFAULT_PROJECTS));
      return DEFAULT_PROJECTS;
    }

    function saveProjects(list) {
      localStorage.setItem('susana_projects', JSON.stringify(list));
    }

    let projects = loadProjects();

    function renderAll() {
      const grid = document.getElementById('projetos');
      const noR = document.getElementById('noResults');
      const term = document.getElementById('search').value.toLowerCase().trim();

      grid.querySelectorAll('.card').forEach(c => c.remove());

      const filtered = projects.filter(p =>
        (p.title + p.desc + (p.tag || '')).toLowerCase().includes(term)
      );

      if (filtered.length === 0) {
        noR.style.display = 'block';
      } else {
        noR.style.display = 'none';
        filtered.forEach((p) => {
          const card = document.createElement('div');
          card.className = 'card';
          
          const labelText = p.linkLabel || formatLinkLabel(p.link);

          card.innerHTML = `
            <span class="card-tag">${p.tag || 'Projeto'}</span>
            <div class="card-icon">${p.icon || '💡'}</div>
            <h2>${p.title}</h2>
            <p>${p.desc}</p>
            <div class="card-footer">
              <a href="${p.link}" target="_blank" rel="noopener noreferrer">${labelText}</a>
              <button class="btn-delete" title="Excluir projeto" data-id="${p.id}">🗑️</button>
            </div>
          `;
          grid.insertBefore(card, noR);
        });
      }

      document.getElementById('projectCount').textContent =
        projects.length === 0 ? 'Nenhum projeto ainda.' : `${projects.length} projeto(s) no portfólio`;
    }

    function buildEmojiGrid() {
      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';
      EMOJIS.forEach(e => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
        btn.textContent = e;
        btn.addEventListener('click', () => {
          selectedEmoji = e;
          document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
        grid.appendChild(btn);
      });
    }

    const overlay = document.getElementById('modalOverlay');

    function openModal() {
      selectedEmoji = '💡';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputDesc').value = '';
      document.getElementById('inputLink').value = '';
      buildEmojiGrid();
      overlay.classList.add('open');
    }

    function closeModal() { overlay.classList.remove('open'); }

    document.getElementById('fabBtn').addEventListener('click', openModal);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('btnCancel').addEventListener('click', closeModal);

    document.getElementById('btnSave').addEventListener('click', () => {
      const title = document.getElementById('inputTitle').value.trim();
      const desc = document.getElementById('inputDesc').value.trim();
      const link = document.getElementById('inputLink').value.trim();

      if (!title) return showToast('⚠️ Informe o título do projeto!');
      if (!link) return showToast('⚠️ Informe o link do projeto!');

      const newProject = {
        id: Date.now(),
        title,
        desc: desc || 'Sem descrição.',
        link,
        linkLabel: formatLinkLabel(link),
        icon: selectedEmoji,
        tag: link.includes('github') ? 'Código' : 'Link'
      };

      projects.push(newProject);
      saveProjects(projects);
      renderAll();
      closeModal();
      showToast('✅ Projeto salvo com sucesso!');
    });

    document.getElementById('projetos').addEventListener('click', e => {
      const btn = e.target.closest('.btn-delete');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (!confirm('Deseja remover este projeto?')) return;
      projects = projects.filter(p => p.id !== id);
      saveProjects(projects);
      renderAll();
      showToast('🗑️ Projeto removido.');
    });

    document.getElementById('search').addEventListener('input', renderAll);

    // Tema Dark/Light
    const themeIcon = document.getElementById('themeIcon');
    let dark = localStorage.getItem('susana_theme') === 'dark';
    if (dark) { document.body.classList.add('dark'); themeIcon.textContent = '☀️'; }

    document.getElementById('toggleTheme').addEventListener('click', () => {
      dark = !dark;
      document.body.classList.toggle('dark', dark);
      themeIcon.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('susana_theme', dark ? 'dark' : 'light');
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    renderAll();
  </script>
</body>
</html>
