<head>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f6fc;
      --card-bg: #ffffff;
      --text: #1e1b2e;
      --subtext: #64748b;
      --accent: #8b5cf6;
      --accent2: #ec4899;
      --shadow: rgba(139, 92, 246, 0.08);
      --card-border: rgba(139, 92, 246, 0.12);
    }
    body.dark {
      --bg: #09090f;
      --card-bg: #13131f;
      --text: #f1f5f9;
      --subtext: #94a3b8;
      --shadow: rgba(139, 92, 246, 0.15);
      --card-border: rgba(139, 92, 246, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      text-align: center;
      padding: 4.5rem 1rem 3.5rem;
      background: linear-gradient(135deg, #d946ef 0%, #8b5cf6 50%, #3b82f6 100%);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .avatar-wrapper img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.2), 0 10px 25px rgba(0,0,0,0.25);
      object-fit: cover;
      display: block;
    }
    header h1 { font-size: 2.5rem; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.15); }
    header p  { font-size: 1rem; color: rgba(255,255,255,0.9); margin-top: 0.3rem; font-weight: 300; }

    /* ── CONTROLS & FILTERS ── */
    .controls-container {
      max-width: 1080px;
      margin: -1.8rem auto 1.5rem;
      padding: 0 1.2rem;
      position: relative;
      z-index: 10;
    }
    .search-and-theme {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--subtext); pointer-events: none; }
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 3rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      box-shadow: 0 8px 25px var(--shadow);
      transition: all 0.3s ease;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 8px 30px rgba(139, 92, 246, 0.2); }
    
    .icon-btn {
      padding: 0.85rem 1.4rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 8px 25px var(--shadow);
      transition: transform 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .icon-btn:hover { opacity: 0.9; transform: translateY(-2px); }

    /* Category Filter Pills */
    .category-filters {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: none;
    }
    .category-filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 0.5rem 1.2rem;
      border: 1px solid var(--card-border);
      border-radius: 50px;
      background: var(--card-bg);
      color: var(--subtext);
      cursor: pointer;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px var(--shadow);
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--accent); }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    /* ── SECTION HEADER ── */
    .section-info {
      max-width: 1080px;
      margin: 1.5rem auto 1rem;
      padding: 0 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title { font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .section-title span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .project-count {
      font-size: 0.85rem;
      color: var(--subtext);
      font-weight: 500;
    }

    /* ── GRID ── */
    main {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.2rem 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.4rem;
      flex: 1;
    }

    /* ── CARDS ── */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.6rem;
      box-shadow: 0 10px 30px var(--shadow);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: riseUp 0.5s forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.3);
    }
    .card-top { margin-bottom: 1rem; }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .card-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }
    .card-tag {
      background: rgba(139, 92, 246, 0.1);
      color: var(--accent);
      font-size: 0.7rem; font-weight: 600;
      padding: 0.25rem 0.7rem; border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card h2 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; line-height: 1.3; }
    .card p  { font-size: 0.88rem; color: var(--subtext); line-height: 1.5; margin-bottom: 1.2rem; }
    
    .card-footer { display: flex; align-items: center; justify-content: flex-end; }
    .card a {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      text-decoration: none; font-weight: 600; font-size: 0.8rem;
      padding: 0.5rem 1.1rem; border-radius: 50px;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }
    .card a:hover { opacity: 0.9; transform: translateX(2px); }

    /* No results state */
    #noResults {
      display: none;
      text-align: center;
      grid-column: 1 / -1;
      color: var(--subtext);
      padding: 4rem 0;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
    }
    #noResults span { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 2rem 1rem;
      background: var(--card-bg); font-size: 0.85rem; color: var(--subtext);
      border-top: 1px solid var(--card-border);
      margin-top: auto;
    }
    .social-links { display: flex; justify-content: center; gap: 1rem; margin-bottom: 0.8rem; }
    .social-links a {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; text-decoration: none; transition: transform 0.2s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }
    .social-links a:hover { transform: translateY(-3px); }

    @keyframes riseUp { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

    let currentCategory = 'all';

    /* ─────────────────────────────────────────
       RENDERIZAÇÃO
    ───────────────────────────────────────── */
    function renderAll() {
      const grid = document.getElementById('projetos');
      const noR  = document.getElementById('noResults');
      const term = document.getElementById('search').value.toLowerCase().trim();

      // Remove cards antigos
      grid.querySelectorAll('.card').forEach(c => c.remove());

      const filtered = PROJECTS.filter(p => {
        const matchesSearch = (p.title + p.desc + (p.tag || '')).toLowerCase().includes(term);
        const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        noR.style.display = 'block';
      } else {
        noR.style.display = 'none';
        filtered.forEach((p, i) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.animationDelay = (i * 0.03) + 's';
          
          const targetLink = p.link || p.documento || '#';
          const targetLabel = p.linkLabel || p.documentoLabel || '🔗 Ver';

          card.innerHTML = `
            <div class="card-top">
              <div class="card-header-row">
                <div class="card-icon">${p.icon || '💡'}</div>
                <span class="card-tag">${p.tag || 'Projeto'}</span>
              </div>
              <h2>${p.title}</h2>
              <p>${p.desc}</p>
            </div>
            <div class="card-footer">
              <a href="${targetLink}" target="_blank">${targetLabel}</a>
            </div>
          `;
          grid.insertBefore(card, noR);
        });
      }

      // Contagem dinâmica
      const totalFiltered = filtered.length;
      document.getElementById('projectCount').textContent =
        totalFiltered === 0 ? 'Nenhum projeto encontrado'
        : `${totalFiltered} projeto${totalFiltered > 1 ? 's' : ''} exibido${totalFiltered > 1 ? 's' : ''}`;
    }

    /* ─────────────────────────────────────────
       FILTROS POR CATEGORIA
    ───────────────────────────────────────── */
    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');
        renderAll();
      });
    });

    /* ─────────────────────────────────────────
       BUSCA
    ───────────────────────────────────────── */
    document.getElementById('search').addEventListener('input', renderAll);

    /* ─────────────────────────────────────────
       TEMA
    ───────────────────────────────────────── */
    const themeIcon = document.getElementById('themeIcon');
    let dark = localStorage.getItem('susana_theme') === 'dark';
    if (dark) { document.body.classList.add('dark'); themeIcon.textContent = '☀️'; }

    document.getElementById('toggleTheme').addEventListener('click', () => {
      dark = !dark;
      document.body.classList.toggle('dark', dark);
      themeIcon.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('susana_theme', dark ? 'dark' : 'light');
    });

    /* ─────────────────────────────────────────
       INICIALIZAÇÃO
    ───────────────────────────────────────── */
    renderAll();
  </script>
